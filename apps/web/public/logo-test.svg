<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<title>DC - Developer Logo</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Geist&amp;display=swap');
		.letter {
			font-family: 'Geist', sans-serif;
			font-size: 300px;
			font-weight: 800;

			--c-l1: hsl(222, 35%, 15%);
			--c-l2: hsl(215, 25%, 25%);
			--c-d1: hsl(210, 40%, 98%);
			--c-d2: hsl(214, 32%, 90%);
		}

		.shadow {
			filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.3));
		}
	</style>

	<text
		x="90"
		y="365"
		class="letter"
		fill="var(--c-l1)"
	>D</text>

	<text
		x="180"
		y="365"
		class="letter shadow"
		fill="var(--c-l2)"
	>C</text>
</svg>
