services:
  postgres:
    image: postgres:17
    container_name: portfolio-postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog_dev_only
    ports:
      - "5433:5432"
    volumes:
      - postgres-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-pgdata:
